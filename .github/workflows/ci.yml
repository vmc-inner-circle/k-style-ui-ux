name: CI

on:
  pull_request:
  push:
    branches: [main, showcase/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: shellcheck build/build.sh
      - name: Verify build and manifests
        run: python3 ci/verify.py

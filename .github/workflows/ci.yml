name: CI

on:
  pull_request:
  push:
    branches: [main, showcase/live]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify manifests and skills
        run: python3 ci/verify.py

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>결제</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="tickets-shop.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">결제</h1><span></span></header>
<main class="page">
  <div class="field"><span class="label">상품</span>
    <div class="row"><span class="thumb"><img src="../assets/photos/studio-oneul.jpg" alt="오늘필라테스 망원"></span>
      <div class="row-main"><p class="row-title">체험 1회권</p><p class="row-sub">오늘필라테스 망원 · 14일 유효 (11월 2일~11월 15일)</p></div>
      <span class="row-trail"><span class="code">25,000원</span></span></div>
  </div>

  <div class="field"><label class="label" for="coupon">쿠폰</label><input class="input" id="coupon" placeholder="쿠폰 번호를 입력해 주세요"></div>

  <div class="field"><span class="label">결제 수단</span>
    <div role="radiogroup" aria-label="결제 수단">
      <div class="row"><div class="row-main"><p class="row-title">카드</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="카드"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><div class="row-main"><p class="row-title">카카오페이</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="true" aria-label="카카오페이"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><div class="row-main"><p class="row-title">네이버페이</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="네이버페이"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
      <div class="row"><div class="row-main"><p class="row-title">토스페이</p></div><span class="row-trail"><button class="check" role="radio" aria-checked="false" aria-label="토스페이"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
    </div>
  </div>

  <div class="field"><span class="label">최종 결제 금액</span>
    <div class="row"><div class="row-main"><p class="row-sub">상품 금액 25,000원 · 쿠폰 할인 0원</p></div><p class="price is-l"><span class="price-now">25,000원</span></p></div>
  </div>

  <div class="field"><span class="label">환불 규정</span>
    <div class="row"><div class="row-main"><p class="row-title">환불 규정에 동의해요 (필수)</p><p class="row-sub">환불은 스튜디오 전화(02-332-1474)로 신청 · 만료되면 남은 횟수는 사라져요 · 체험 1회권은 일시정지 불가</p></div>
      <span class="row-trail"><button class="check" role="checkbox" aria-checked="true" aria-label="환불 규정 동의"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button></span></div>
  </div>
</main>
<div class="cta"><a class="btn primary full" href="pay-done.html">25,000원 결제하기</a></div>
</body></html>

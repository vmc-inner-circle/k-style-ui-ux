<!doctype html>

    <div class="row"><span class="row-art"><img src="../assets/fluent/pin.svg" alt=""></span><div class="row-main"><p class="row-title">허용 안 함</p><p class="row-sub">도착 확인으로 출석할 때 필요해요</p></div><span class="row-trail"><button class="btn small tint">시스템 설정</button></span></div>
  </section>

  <section class="block is-list">
    <div class="block-head"><h2 class="h2">계정</h2></div>
    <div class="row"><div class="row-main"><p class="row-title">연결된 로그인</p></div><span class="row-trail"><span class="code">카카오</span></span></div>
    <a class="row" href="login.html"><div class="row-main"><p class="row-title">로그아웃</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></a>

    <div class="row"><div class="row-main"><p class="row-title">버전</p></div><span class="row-trail"><span class="code">2.0.0</span></span></div>

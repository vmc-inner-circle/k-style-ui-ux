<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>스튜디오 찾기 · 지도</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
/* 지도 전용 — 토큰만 쓴다 */
.map { position: relative; margin: 0 var(--stack-m); border-radius: var(--r-l); overflow: hidden; background: var(--c-surface); }
.map .map-svg { width: 100%; height: auto; }
.map-land { fill: var(--c-surface); }
.map-river { fill: var(--c-info-tint); }
.map-park { fill: var(--c-success-tint); }
.map-road { fill: none; stroke: var(--c-line); stroke-width: 6; stroke-linecap: round; }
.map-road.is-main { stroke-width: 12; }
.map-ring { fill: var(--c-brand); fill-opacity: .05; stroke: var(--c-brand); stroke-opacity: .45; stroke-width: 1.5; stroke-dasharray: 4 4; }
.map-ring-label { font-size: var(--fs-caption); font-weight: 600; fill: var(--c-brand-text); }
.map-area { font-size: var(--fs-caption); font-weight: 600; fill: var(--c-info-tint-text); }
.map-me-halo { fill: var(--c-info); fill-opacity: .18; }
.map-me { fill: var(--c-info); stroke: var(--c-surface); stroke-width: 2.5; }
.map-pin path { fill: var(--c-surface); stroke: var(--c-brand); stroke-width: 2; }
.map-pin text { font-size: var(--fs-caption); font-weight: 600; fill: var(--c-text-2); paint-order: stroke; stroke: var(--c-surface); stroke-width: 3px; }
.map-pin.is-selected path { fill: var(--c-brand); }
.map-pin.is-selected .map-pin-dot { fill: var(--c-surface); }
.map-pin.is-selected text { fill: var(--c-text-1); font-weight: 700; }
.map-again { position: absolute; top: var(--stack-m); left: 50%; transform: translateX(-50%); background: var(--c-surface); color: var(--c-text-1); box-shadow: var(--shadow-1); border-radius: var(--r-pill); white-space: nowrap; }
.map-again svg { width: 18px; height: 18px; }
.row-sub > .rating svg { width: 14px; height: 14px; }
.row-sub > .rating { vertical-align: -2px; margin-right: 2px; }
.chip svg { width: 16px; height: 16px; }
</style>
</head>

  <header class="hero">

  <div class="map">

      <rect class="map-land" width="343" height="340"/>

      <path class="map-road is-main" d="M120 0 L210 340"/>
      <path class="map-road" d="M0 215 L343 105"/>
      <path class="map-road" d="M30 0 L100 250"/>
      <path class="map-road" d="M262 0 L300 290"/>
      <circle class="map-ring" cx="172" cy="200" r="100"/>
      <circle class="map-ring" cx="172" cy="200" r="50"/>
      <text class="map-ring-label" x="172" y="266" text-anchor="middle">500m</text>
      <text class="map-ring-label" x="172" y="314" text-anchor="middle">1km</text>
      <text class="map-area" x="24" y="326">한강</text>
      <circle class="map-me-halo" cx="172" cy="200" r="14"/>
      <circle class="map-me" cx="172" cy="200" r="6"/>
      <g class="map-pin"><path d="M140 212c0 0-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z"/><text x="140" y="228" text-anchor="middle">숨필라테스</text></g>
      <g class="map-pin"><path d="M270 130c0 0-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z"/><text x="270" y="146" text-anchor="middle">바른몸</text></g>
      <g class="map-pin"><path d="M40 160c0 0-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z"/><text x="40" y="176" text-anchor="middle">리듬필라테스</text></g>
      <g class="map-pin"><path d="M250 245c0 0-10-9-10-16a10 10 0 0 1 20 0c0 7-10 16-10 16z"/><text x="250" y="261" text-anchor="middle">하루요가</text></g>
      <g class="map-pin is-selected"><path d="M200 165c0 0-14-12-14-22a14 14 0 0 1 28 0c0 10-14 22-14 22z"/><circle class="map-pin-dot" cx="200" cy="143" r="5"/><text x="200" y="181" text-anchor="middle">오늘필라테스</text></g>
    </svg>
    <button class="btn small map-again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.1-5"/><path d="M19 4.5V8h-3.5"/></svg>이 지역에서 다시 찾기</button>
  </div>

  </section>
</main>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>리뷰 작성</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
/* 리뷰 작성 전용 — 토큰만 쓴다 */
textarea.input { height: auto; min-height: calc(var(--h-btn) * 3); padding: var(--stack-m); line-height: var(--lh-body); resize: none; }
.field-foot { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--c-text-2); font-variant-numeric: tabular-nums; }
.chips.is-wrap { flex-wrap: wrap; overflow: visible; padding: 0; margin: 0; }
.plain .page > .done { margin: 0; }
.review-text { font-size: var(--fs-body); line-height: var(--lh-body); }
</style>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="my-bookings-past.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">리뷰 작성</h1><span></span></header>
<main class="page">
  <div class="row"><span class="thumb"><img src="../assets/photos/studio-sum.jpg" alt="숨필라테스 망원점"></span><div class="row-main"><p class="row-title">리포머 중급 · 한소라</p><p class="row-sub">숨필라테스 망원점 · 10월 29일(목) 20:00</p></div></div>
  <div class="field"><span class="label">별점</span>
    <div class="rating is-input" role="radiogroup" aria-label="별점"><button class="is-on" role="radio" aria-checked="false" aria-label="1점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="2점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button class="is-on" role="radio" aria-checked="false" aria-label="3점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button class="is-on" role="radio" aria-checked="true" aria-label="4점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button><button role="radio" aria-checked="false" aria-label="5점"><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></button></div>
  </div>
  <div class="field"><span class="label">좋았던 점 · 여러 개 고를 수 있어요</span>
    <div class="chips is-wrap" role="group" aria-label="좋았던 점"><button class="chip" aria-pressed="false">친절해요</button><button class="chip is-selected" aria-pressed="true">자세 교정 꼼꼼</button><button class="chip" aria-pressed="false">시설 깨끗</button><button class="chip is-selected" aria-pressed="true">강도 적당</button><button class="chip" aria-pressed="false">주차 편함</button></div>
  </div>
  <div class="field"><label class="label" for="txt">수업 후기</label>
    <textarea class="input" id="txt" rows="5" maxlength="500" placeholder="10자 이상 써 주세요">한소라 선생님이 동작마다 자세를 꼼꼼하게 잡아 주셨어요. 중급이라 강도도 딱 적당했고, 끝나고 허리가 한결 가벼워요.</textarea>
    <p class="field-foot"><span>닉네임으로 올라가요 · 11월 12일(목)까지 쓸 수 있어요</span><span>65/500</span></p>
  </div>
</main>
<div class="cta"><a class="btn primary full" href="review-write--done.html">등록하기</a></div>
</body></html>

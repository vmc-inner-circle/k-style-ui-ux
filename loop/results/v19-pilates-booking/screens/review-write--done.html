<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>리뷰 작성 · 등록 후</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
/* 리뷰 작성 전용 — 토큰만 쓴다 */
textarea.input { height: auto; min-height: calc(var(--h-btn) * 3); padding: var(--stack-m); line-height: var(--lh-body); resize: none; }
.field-foot { display: flex; justify-content: space-between; font-size: var(--fs-caption); color: var(--c-text-2); font-variant-numeric: tabular-nums; }
.chips.is-wrap { flex-wrap: wrap; overflow: visible; padding: 0; margin: 0; }
.plain .page > .done { margin: 0; }
.review-text { font-size: var(--fs-body); line-height: var(--lh-body); }
</style>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="my-bookings-past.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">리뷰 작성</h1><span></span></header>
<main class="page">
  <p class="done">리뷰가 등록됐어요</p>
  <div class="row"><span class="thumb"><img src="../assets/photos/studio-sum.jpg" alt="숨필라테스 망원점"></span><div class="row-main"><p class="row-title">리포머 중급 · 한소라</p><p class="row-sub">숨필라테스 망원점 · 10월 29일(목) 20:00</p></div></div>
  <div class="field"><span class="label">별점</span>
    <div class="rating" role="img" aria-label="5점 중 4점"><svg class="is-on" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><svg class="is-on" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><svg class="is-on" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><svg class="is-on" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg><svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg></div>
  </div>
  <div class="field"><span class="label">좋았던 점</span>
    <div class="chips is-wrap"><span class="chip is-selected">자세 교정 꼼꼼</span><span class="chip is-selected">강도 적당</span></div>
  </div>
  <div class="field"><span class="label">수업 후기</span>
    <p class="review-text">한소라 선생님이 동작마다 자세를 꼼꼼하게 잡아 주셨어요. 중급이라 강도도 딱 적당했고, 끝나고 허리가 한결 가벼워요.</p>
  </div>
  <a class="info" href="mypage.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg><span>마이 &gt; 내가 쓴 리뷰에서 고치거나 지울 수 있어요</span></a>
</main>
<div class="cta"><a class="btn primary full" href="my-bookings-past.html">지난 수업 확인하기</a></div>
</body></html>

<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>일정 고치기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="day-edit.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">일정 고치기</h1><span></span></header>
<main class="page">
  <div class="field"><span class="label">날짜 · 1월 15일 금</span>
    <div class="seg" role="radiogroup"><button class="seg-item" role="radio" aria-checked="false">1일차</button><button class="seg-item is-selected" role="radio" aria-checked="true">2일차</button><button class="seg-item" role="radio" aria-checked="false">3일차</button><button class="seg-item" role="radio" aria-checked="false">4일차</button></div>
  </div>
  <div class="field"><span class="label">상태</span>
    <div class="seg" role="radiogroup"><button class="seg-item" role="radio" aria-checked="false">후보</button><button class="seg-item is-selected" role="radio" aria-checked="true">확정</button></div>
  </div>
  <div class="field"><label class="label" for="n">무엇을 하나요?</label><input class="input" id="n" value="유후인노모리 열차"></div>
  <div class="field"><span class="label">종류</span>
    <div class="chips"><button class="chip is-selected">이동</button><button class="chip">숙박</button><button class="chip">활동</button></div>
  </div>
  <div class="field"><label class="label" for="s">출발</label><input class="input" id="s" value="10:12 하카타역"></div>
  <div class="field"><label class="label" for="e">도착</label><input class="input" id="e" value="12:28 유후인역"></div>
  <div class="field"><label class="label" for="m">메모</label><input class="input" id="m" placeholder="적어 둘 것이 있으면 적어요"></div>
  <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>확정된 일정을 고치면 다음 가족 소식에 '바뀜'으로 담겨요 (9:24 → 10:12)</span></p>
  <a class="btn secondary full" href="day-edit.html">지우기</a>
</main>
<div class="cta"><a class="btn primary full" href="day-edit.html">저장</a></div>

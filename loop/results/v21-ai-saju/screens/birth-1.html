<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>생년월일 입력 1/2</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="start.html" aria-label="뒤로"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="appbar-title">내 정보 입력</h1><span></span></header>
<main class="page">

  <div class="field"><label class="label" for="name">이름(닉네임)</label><input class="input" id="name" value="한소윤"></div>

  <div class="field"><label class="label" for="birth">생년월일</label><input class="input" id="birth" value="1999년 8월 14일" inputmode="numeric"></div>

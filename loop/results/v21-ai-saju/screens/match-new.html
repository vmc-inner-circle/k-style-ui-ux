<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>궁합 · 상대 고르기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
.pair { display: flex; align-items: center; gap: var(--stack-m); }
.pair-side { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: var(--stack-s); text-align: center; }
.pair-name { font-size: var(--fs-strong); font-weight: var(--fw-strong); }
.pair-x { flex: none; color: var(--c-text-3); }
.pair-x svg { width: 20px; height: 20px; }
.pair-side .block-link { min-height: 32px; color: var(--c-brand-text); }
</style>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="home.html" aria-label="뒤로"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="appbar-title">궁합</h1><span></span></header>
<main class="page">
  <section class="block">
    <div class="pair">
      <div class="pair-side"><span class="avatar is-text">소</span><p class="pair-name">한소윤 (나)</p><a class="btn small secondary" href="match-pick.html">바꾸기</a></div>
      <span class="pair-x" aria-label="와"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></span>
      <div class="pair-side"><span class="avatar is-text">도</span><p class="pair-name">이도현</p><span class="badge is-info">무료</span></div>
    </div>
  </section>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">상대 고르기</h2></div>
    <button class="row" role="radio" aria-checked="true"><span class="avatar is-text">도</span><div class="row-main"><p class="row-title">이도현</p><p class="row-sub">연인 · 같은 상대 다시 보기는 무료</p></div><span class="row-trail"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
    <button class="row" role="radio" aria-checked="false"><span class="avatar is-text">서</span><div class="row-main"><p class="row-title">이서진</p><p class="row-sub">친구</p></div></button>
    <a class="row is-add" href="person-edit.html"><span class="row-lead"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><div class="row-main"><p class="row-title">새로 입력</p></div></a>
  </section>
  <section class="block">
    <div class="block-head"><h2 class="h2">두 사람의 관계</h2></div>
    <div class="chips" role="radiogroup" aria-label="관계"><button class="chip is-selected" role="radio" aria-checked="true">연인</button><button class="chip" role="radio" aria-checked="false">배우자</button><button class="chip" role="radio" aria-checked="false">가족</button><button class="chip" role="radio" aria-checked="false">친구</button><button class="chip" role="radio" aria-checked="false">동료</button></div>
    <p class="block-note">관계에 따라 보는 관점이 달라져요</p>
  </section>
  <p class="info"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/></svg><span>상대 정보는 내 계정에만 저장되고, 상대에게 알리지 않아요</span></p>
</main>
<div class="cta"><a class="btn primary full" href="match.html">궁합 풀기</a></div>
</body></html>

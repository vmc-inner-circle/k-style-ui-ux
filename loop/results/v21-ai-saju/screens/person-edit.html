<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>저장한 사람 수정 · 이도현</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>.danger-text { color: var(--c-danger); }</style>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="my.html" aria-label="뒤로"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a><h1 class="appbar-title">이도현 수정</h1><span></span></header>
<main class="page">
  <div class="field"><label class="label" for="n">이름</label><input class="input" id="n" value="이도현"></div>
  <div class="field"><span class="label">관계</span>
    <div class="chips" role="radiogroup" aria-label="관계"><button class="chip is-selected" role="radio" aria-checked="true">연인</button><button class="chip" role="radio" aria-checked="false">배우자</button><button class="chip" role="radio" aria-checked="false">가족</button><button class="chip" role="radio" aria-checked="false">친구</button><button class="chip" role="radio" aria-checked="false">동료</button></div></div>
  <div class="field"><span class="label">성별</span>
    <div class="seg" role="radiogroup" aria-label="성별"><button class="seg-item" role="radio" aria-checked="false">여성</button><button class="seg-item is-selected" role="radio" aria-checked="true">남성</button></div></div>
  <div class="field"><span class="label">달력</span>
    <div class="seg" role="radiogroup" aria-label="달력"><button class="seg-item is-selected" role="radio" aria-checked="true">양력</button><button class="seg-item" role="radio" aria-checked="false">음력</button></div></div>
  <div class="field"><label class="label" for="b">생년월일</label><input class="input" id="b" value="1997년 3월 22일"></div>
  <div class="field"><span class="label">태어난 시간</span>
    <section class="block is-list">
      <div class="row"><div class="row-main"><p class="row-title">시간을 몰라요</p></div><span class="row-trail"><button class="switch" role="switch" aria-checked="true" aria-label="시간을 몰라요"></button></span></div>
    </section>
    <p class="info"><img src="../assets/fluent/clipboard.svg" alt=""><span>나중에 알게 되면 여기서 넣을 수 있어요</span></p>
  </div>
  <a class="btn secondary full danger-text" href="my.html">이 사람 지우기</a>
</main>
<div class="cta"><a class="btn primary full" href="my.html">저장하기</a></div>
</body></html>

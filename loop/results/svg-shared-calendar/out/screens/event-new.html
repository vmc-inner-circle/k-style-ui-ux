<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>새 일정</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="home.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">새 일정</h1><span></span></header>
<main class="page">
  <div class="field"><span class="label">자주 쓰는 일정</span>
    <div class="chips"><button class="chip">하윤 피아노</button><button class="chip">지은 요가</button><button class="chip">하윤 수영</button><button class="chip">지난 일정</button></div>
  </div>
  <div class="field"><label class="label" for="n">이름</label><input class="input" id="n" value="준 소아과 검진"></div>
  <div class="field"><span class="label">종류</span>
    <div class="chips">
      <button class="chip is-selected"><img src="../assets/fluent/hospital.svg" alt="">병원</button>
      <button class="chip"><img src="../assets/fluent/musical-keyboard.svg" alt="">학원</button>
      <button class="chip"><img src="../assets/fluent/person-swimming.svg" alt="">운동</button>
      <button class="chip"><img src="../assets/fluent/school.svg" alt="">학교</button>
      <button class="chip"><img src="../assets/fluent/spaghetti.svg" alt="">외식</button>
      <button class="chip"><img src="../assets/fluent/birthday-cake.svg" alt="">기념일</button>
      <button class="chip"><img src="../assets/fluent/recycling-symbol.svg" alt="">집안일</button>
      <button class="chip">집에 없어요</button>
    </div>
  </div>
  <div class="field"><span class="label">누구의 일정</span>
    <div class="chips"><button class="chip">지은</button><button class="chip">민수</button><button class="chip">하윤</button><button class="chip is-selected">준</button></div>
  </div>
  <div class="field"><label class="label" for="t">날짜와 시간</label><input class="input" id="t" value="11월 5일 목 10:30~11:30" placeholder="날짜와 시간을 골라 주세요"></div>
  <div class="field"><span class="label">반복</span>
    <div class="seg" role="radiogroup"><button class="seg-item is-selected" role="radio" aria-checked="true">없음</button><button class="seg-item" role="radio" aria-checked="false">매주</button><button class="seg-item" role="radio" aria-checked="false">격주</button></div>
  </div>
  <div class="field"><span class="label">맡을 사람</span>
    <div class="chips"><button class="chip is-selected">아직 안 정함</button><button class="chip">지은</button><button class="chip">민수</button></div>
    <p class="info"><img src="../assets/fluent/bell.svg" alt=""><span>11월 4일 수 저녁 8시까지 아무도 안 맡으면 지은·민수에게 한 번 알려요</span></p>
  </div>
  <div class="field"><label class="label" for="p">장소 (선택)</label><input class="input" id="p" value="연세소아과"></div>
  <div class="photo is-16x9"><img src="../assets/photos/ev-hospital.jpg" alt="소아과 진료실에서 청진을 받는 아이"></div>
</main>
<div class="cta"><a class="btn primary full" href="event-saved.html">저장하기</a></div>
</body></html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전체 화면 한눈에 보기</title>
<!-- 캔버스 템플릿(정적). build_canvas.py 가 아래 hd-data 에 데이터만 끼워 넣는다. 외부 라이브러리 없음. -->
<link id="tokens" rel="stylesheet" href="tokens.css" media="print" onload="this.media='all'">
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{display:flex;flex-direction:column;background:#ECECE8;color:#1c1c1c;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;word-break:keep-all;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}

/* ---------- 헤더: 제목 · 탭 · 팔레트 · 보기 (조작 그룹 3개) ---------- */
.hd{flex:none;display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;padding:8px 16px;background:#fff;border-bottom:1px solid #dcdcd7;position:relative;z-index:5}
.hd h1{font-size:17px;font-weight:700;margin:0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:320px}
.tabs{display:flex;gap:2px;background:#EFEFEB;border-radius:12px;padding:3px}
.tab{min-height:44px;min-width:44px;padding:0 16px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:600;color:#5a5a55;cursor:pointer}
.tab[aria-selected="true"]{background:#fff;color:#1c1c1c;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pal{display:flex;align-items:center;gap:2px;margin-left:auto}
.pal-label{font-size:13px;color:#777;margin-right:4px}
.dot{display:inline-flex;align-items:center;gap:8px;min-height:44px;min-width:44px;padding:0 10px;border:0;border-radius:999px;background:transparent;font-size:14px;color:#444;cursor:pointer}
.dot i{flex:none;width:22px;height:22px;border-radius:999px;background:var(--dot);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.dot[aria-pressed="true"]{background:#F1F1ED;color:#1c1c1c;font-weight:700}
.dot[aria-pressed="true"] i{box-shadow:0 0 0 2px #fff,0 0 0 4px #1c1c1c}
.dot:hover{background:#F5F5F2}
.view{display:flex;align-items:center;gap:4px}
.vbtn{min-height:44px;min-width:44px;padding:0 14px;border:1px solid #dcdcd7;border-radius:10px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.vbtn:hover{background:#F5F5F2}
.zoom{min-width:64px;font-variant-numeric:tabular-nums;color:#555}
body:not([data-tab="screens"]) .view,body.modal-open .view{visibility:hidden}
@media (max-width:760px){
  .hd{padding:6px 10px;gap:4px 8px}
  .hd h1{flex:1 1 0;font-size:16px;order:1;max-width:none}
  .pal{order:2;margin-left:0}
  .tabs{order:3}
  .view{order:4;margin-left:auto}
  .tab{padding:0 7px;font-size:13px}
  .fit-long{display:none}
  .zoom{min-width:52px}
  .dot{padding:0}
  .dot{justify-content:center}
  .dot b,.pal-label{display:none}
  .vbtn{padding:0 10px}
}

/* ---------- 판 ---------- */
.panes{flex:1;position:relative;overflow:hidden}
.pane{position:absolute;inset:0}
.pane[hidden]{display:none}
.pane iframe.doc{width:100%;height:100%;border:0;display:block;background:#F6F6F3}
#screens{overflow:hidden;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
#screens.dragging{cursor:grabbing}
#screens.dragging .cover{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;width:max-content;will-change:transform}

/* 판 안의 글 — 첫 배율 0.72 기준으로 읽히게 크게 쓴다(22px → 약 16px) */
.intro{padding:48px 0 0;max-width:1760px}
.intro-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px;align-items:start}
.hint{font-size:20px;color:#6b6b66;margin:0 0 18px}
.story h2{font-size:42px;line-height:1.3;margin:0 0 14px}
.story h2 em{font-style:normal;color:var(--c-brand,#2563eb)}
.story .sum{font-size:22px;line-height:1.6;color:#444;margin:0 0 24px}
.ideas{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.idea{background:#fff;border-radius:20px;padding:22px}
.idea b{font-size:22px}
.idea p{font-size:19px;line-height:1.55;color:#555;margin:8px 0 0}
.people{margin-top:20px}
.people h3{font-size:22px;margin:0 0 10px}
.people ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.people li{background:#fff;border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.45;color:#555}
.people li b{display:block;font-size:18px;color:#1c1c1c;margin-bottom:2px}
.people li .win{display:block;color:#1c1c1c;margin-top:4px}
.decisions{margin-top:6px}
.narrow .ideas,.narrow .decisions ul,.narrow .people ul,.narrow .intro-grid{grid-template-columns:1fr}
.narrow .decisions{margin-top:0}
.narrow .story h2{font-size:38px}
.decisions h3{font-size:27px;margin:0 0 8px}
.decisions .core{font-size:21px;color:#333;margin:0 0 14px}
.decisions ul{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.decisions li{background:#fff;border-radius:16px;padding:14px 18px;font-size:19px;line-height:1.45}
.decisions li b{margin-right:4px}
.decisions .why{display:block;color:#666;font-size:18px}
.v{display:inline-block;font-size:15px;font-weight:700;border-radius:8px;padding:2px 9px;margin-right:8px;background:#eee;color:#444;vertical-align:2px}
.v-cut{background:#fde8e8;color:#9b1c1c}
.v-lighten{background:#e7f0ff;color:#1d4ed8}
.v-follow{background:#e6f6ec;color:#166534}
.decisions h3.mk{margin-top:18px}

.rows{position:relative;padding-bottom:40px}
.flow{padding-top:90px}
.glabel{font-size:31px;font-weight:700;margin:0 0 104px;white-space:nowrap}
.cards{display:flex;gap:84px;align-items:flex-start}
.card{flex:none;width:375px;position:relative}
.phone{position:relative;width:375px;height:812px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.10)}
.card.xp{z-index:6}
.card.xp>:not(.phone):not(.anno){visibility:hidden}
.phone iframe{display:block;width:375px;height:812px;border:0;pointer-events:none;background:#fff}
.cover{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;margin:0;background:transparent;border-radius:28px;cursor:pointer}
.cover:hover,.cover:focus-visible{outline:4px solid #2563eb;outline-offset:0}
.ftitle{font-size:22px;font-weight:700;margin-top:16px;line-height:1.35}
.state{display:inline-block;font-size:15px;font-weight:700;color:#8a5a00;background:#fff3cf;border-radius:8px;padding:2px 8px;margin-right:8px;vertical-align:2px}
.fdesc{font-size:18px;color:#555;margin-top:4px;line-height:1.45}
.pol{margin:8px 0 0;padding-left:22px;font-size:17px;line-height:1.5;color:#444}
.more{font-size:17px;color:#666;margin-top:4px}
.more summary,.foot summary{cursor:pointer;min-height:44px;display:flex;align-items:center}
.more .pol{margin-top:0}
svg.ar{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
/* 주요 흐름(screens.json 갈래) = 회색 점선 */
svg.ar path.ln{fill:none;stroke:#9AA09A;stroke-width:calc(var(--lw,2) * .8);stroke-dasharray:calc(var(--lw,2) * 3) calc(var(--lw,2) * 2.5);stroke-linecap:butt;stroke-linejoin:round;marker-end:url(#hd-head)}
svg.ar marker path,svg.ar marker circle{fill:#9AA09A}
/* 갈래 이름표: 평소엔 숨김(선만). 연결 보기에서 화면 안 링크 답이 없을 때만 출발 카드 오른쪽에 */
.alabel{position:absolute;display:none;background:#fff;border:2px solid #8a8d86;color:#4a4c47;font-size:17px;font-weight:700;padding:3px 12px;border-radius:999px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.10)}
.foot{padding:20px 0 120px;font-size:17px;color:#777;max-width:1500px}
.foot p{margin:0 0 6px}
.foot ul{margin:4px 0 0;padding-left:22px;line-height:1.6}
.foot a{color:#555}

/* ---------- 크게 보기 ---------- */
#modal{position:fixed;inset:0;z-index:20;background:rgba(20,20,20,.62);display:flex;flex-direction:column;align-items:center;justify-content:center}
#modal[hidden]{display:none}
#modal .box{position:relative;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#modal iframe{display:block;width:390px;height:844px;border:0;transform-origin:0 0;background:#fff}
#modal .close{position:absolute;top:max(10px,env(safe-area-inset-top));right:12px;min-width:44px;min-height:44px;padding:0 16px;border:0;border-radius:12px;background:#fff;font-size:15px;font-weight:600;cursor:pointer;z-index:2}
#modal .mpick{flex:none;margin:48px 0 12px;min-width:44px;min-height:44px;padding:0 26px;border:2px solid #fff;border-radius:999px;background:var(--c-brand,#2563eb);color:#fff;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#modal .mpick:hover{filter:brightness(1.08)}
#modal .mpick[aria-pressed="true"]{background:#fff;color:var(--c-brand-text,#1d4ed8);border-color:var(--c-brand,#2563eb)}

/* ---------- 연결 보기: 화살표 켜고 끄기 · Shift+클릭 강조 ---------- */
.vbtn[aria-pressed="false"]{color:#999;text-decoration:line-through}
#rows.noarrows path.ln,#rows.noarrows .alabel{display:none}
#rows.focusing .card{opacity:.22}
#rows.focusing .card.hl{opacity:1}
#rows.focusing .card.hl .phone{box-shadow:0 0 0 6px #8a8d86,0 3px 14px rgba(0,0,0,.10)}
#rows.focusing .card.focus .phone{box-shadow:0 0 0 10px #1c1c1c,0 3px 14px rgba(0,0,0,.10)}
#rows.focusing path.ln{opacity:.18}
#rows.focusing path.ln.on{opacity:1;stroke:#7d827d;display:inline}
#rows.focusing path.ln.rep{display:none}
#rows.focusing:not(.haslk):not(.lkwait) .alabel.on{display:block}
#rows.focusing .card.lt .phone{box-shadow:0 0 0 8px var(--ring),0 3px 14px rgba(0,0,0,.10)}
#rows.focusing .card.lt.em .phone{box-shadow:0 0 0 14px var(--ring),0 3px 14px rgba(0,0,0,.10)}
#rows.focusing .card.lt.dim{opacity:.3}
/* 색 링크 층: 카드(펼친 카드 포함) 위에 선·선 위 태그 */
svg.lks{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:7}
svg.lks path.lk{fill:none;stroke-width:var(--lkw,2.5px);stroke-linecap:round;stroke-linejoin:round;pointer-events:stroke;cursor:default}
svg.lks path.lk.em{stroke-width:calc(var(--lkw,2.5px) + 2px)}
svg.lks path.lk.dim{opacity:.15}
#lkl{position:absolute;left:0;top:0;width:0;height:0;z-index:8}
.ltag{position:absolute;left:0;top:0;visibility:hidden;transform:translate(-50%,-50%) scale(var(--ts,1));background:#fff;border:2px solid currentColor;border-radius:999px;padding:2px 12px;font-size:16px;line-height:1.35;font-weight:700;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:default}
/* --ts: 작게 볼 때(배율 < 1) 태그를 화면에서 글자 12px · 테두리 1.5px 이상으로(가운데 고정) */
.ltag.on{visibility:visible}
.ltag.em{box-shadow:0 0 0 3px currentColor}
.ltag.dim{opacity:.15}
.lnum{position:absolute;left:10px;top:10px;z-index:1;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:var(--ring);color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.nbadge{position:absolute;top:56px;right:10px;z-index:1;min-width:34px;height:34px;padding:0 9px;border-radius:999px;background:#e5484d;color:#fff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
/* 범례(연결 보기 중에만): 쌍마다 켜고 끄기 · 색 · 굵기 */
#legend{position:absolute;right:12px;bottom:10px;z-index:4;width:360px;max-height:calc(100% - 20px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.14);padding:12px 14px;font-size:13px;cursor:default;touch-action:auto;-webkit-user-select:none;user-select:none}
#legend[hidden],body.modal-open #legend{display:none}
#legend .lgt{margin:0 0 8px;font-size:13px;font-weight:700;color:#1c1c1c}
#legend .lgrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:8px;cursor:pointer}
#legend .lgrow:hover,#legend .lgrow.em{background:#F4F5F3}
#legend .lgrow.dim{opacity:.45}
#legend .lgall{font-weight:600}
#legend .lgdot{width:16px;height:16px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px #ccc;cursor:pointer;padding:0}
#legend .lgtx{flex:1;line-height:1.35;color:#333}
#legend .lgtx i{font-style:normal;color:#777}
#legend input[type=checkbox]{accent-color:#444;width:16px;height:16px}
#legend .lgstyle{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;margin-top:8px;padding-top:8px;color:#777}
#legend .lgddw{display:flex;align-items:center;gap:6px}
#legend .lgddb{display:flex;align-items:center;gap:6px;border:1.5px solid #e2e2de;border-radius:8px;background:#fff;padding:4px 8px;cursor:pointer;font-size:12px;color:#1c1c1c;white-space:nowrap}
.sw{display:inline-flex;gap:2px}.sw i{width:9px;height:9px;border-radius:50%}
#legend .lgw{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
#legend .lgw input{flex:1;min-width:0}
#legend .lgw b{font-size:12px;color:#444;min-width:40px;font-variant-numeric:tabular-nums}
.lgdd{position:fixed;z-index:30;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:5px;width:214px;font-size:12px}
.lgdd[hidden],.lgsw[hidden]{display:none}
.lgdd button{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:#fff;border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px;font-weight:600;text-align:left}
.lgdd button:hover{background:#F4F5F3}.lgdd button.on{background:#EEF0EE}
.lgdd hr{border:0;border-top:1px solid #eee;margin:4px 2px}.lgdd .mut{color:#777;font-weight:500}
.lgsw{position:fixed;z-index:31;background:#fff;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px;width:190px}
.lgsw .g{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.lgsw .g button{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;cursor:pointer;padding:0}
.lgsw .x{display:flex;align-items:center;justify-content:space-between;margin-top:7px;font-size:11px;color:#777}
.lgsw input[type=color]{width:34px;height:22px;border:0;padding:0;background:none}
/* 전환 메뉴(T): 캔버스 전환마다 이름 · 쓰는 곳 · 시간/곡선 토큰 · ▶ 보기 · 애니메이션 끄기 */
#tmenu{position:fixed;z-index:26;right:12px;top:64px;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.22);padding:10px 12px;font-size:13px}
#tmenu[hidden]{display:none}
#tmenu h2{font-size:14px;margin:2px 4px 6px}
#tmenu .trow{display:grid;grid-template-columns:1fr auto;gap:1px 12px;align-items:center;padding:7px 4px;border-top:1px solid #f0f0ec}
#tmenu .tn{font-weight:700}
#tmenu .tw{color:#777;font-size:12px}
#tmenu .tv{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#555}
#tmenu .tplay{grid-column:2;grid-row:1 / span 3;min-height:36px;padding:0 12px;border:1px solid #dcdcd7;border-radius:9px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
#tmenu .tplay:hover{background:#F5F5F2}
#tmenu .toff{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;padding:9px 4px 2px;cursor:pointer}
#legend .lgflow{display:flex;align-items:center;gap:8px;border-top:1px solid #eee;margin-top:8px;padding-top:8px;color:#555;cursor:pointer}

/* 카드 위 주석 버튼: 화면 밖(카드 오른쪽 위), 캔버스 조작 모양 · 단축키 안내 */
.anno{position:absolute;bottom:calc(100% + 8px);right:0;z-index:2;min-width:44px;min-height:36px;padding:0 14px;border:0;border-radius:999px;background:#2b2b29;color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none}
.anno::before{content:"\270E\00a0";font-weight:400}
.anno::after{content:'';position:absolute;left:0;right:0;top:100%;height:10px}
.card:hover .anno,.anno:focus-visible{display:block}
#khint{position:absolute;left:12px;bottom:10px;z-index:3;pointer-events:none;font-size:13px;color:#6b6b66;background:rgba(255,255,255,.82);border-radius:8px;padding:5px 10px;white-space:nowrap}
body.modal-open #khint{display:none}

/* ---------- 주석 달기 · 메모 ---------- */
#mpins{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pin{position:absolute;transform:translate(-40%,-40%);min-width:24px;height:24px;padding:0 4px;border-radius:999px;background:#e5484d;color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin-box{position:absolute;border:2px dashed #e5484d;border-radius:4px}
.sel-box{position:absolute;border:2px solid #2563eb;background:rgba(37,99,235,.10);border-radius:4px}
.sel-box b{position:absolute;left:-2px;top:-20px;min-width:18px;height:18px;padding:0 4px;border-radius:999px;background:#2563eb;color:#fff;font-size:12px;line-height:18px;text-align:center}
#pop{position:fixed;z-index:40;width:300px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);padding:12px;font-size:14px}
#pop[hidden]{display:none}
#pop .ptitle{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pop .ppath{font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#777;margin:2px 0 8px;word-break:break-all;white-space:pre-line;max-height:80px;overflow:auto}
#pop textarea{width:100%;min-height:72px;border:1px solid #dcdcd7;border-radius:8px;padding:8px;font:inherit;resize:vertical}
#pop .prow{display:flex;align-items:center;gap:6px;margin-top:8px}
#pop .seg{display:flex;background:#EFEFEB;border-radius:9px;padding:2px;margin-right:auto}
#pop .seg button{border:0;background:transparent;border-radius:7px;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:600;color:#666}
#pop .seg button[aria-pressed="true"]{background:#fff;color:#1c1c1c;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nbtn{min-height:36px;padding:0 12px;border:1px solid #dcdcd7;border-radius:9px;background:#fff;font-size:14px;font-weight:600;cursor:pointer}
.nbtn.pri{background:#2563eb;border-color:#2563eb;color:#fff}
#notes{position:fixed;z-index:30;right:12px;top:72px;width:320px;max-height:calc(100vh - 96px);display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:14px}
#notes[hidden]{display:none}
#notes h2{font-size:15px;margin:0;padding:12px 14px 6px}
#notes ol{list-style:none;margin:0;padding:0 8px;overflow:auto;flex:1}
#notes li{padding:8px 6px;border-top:1px solid #eee}
#notes li.sent{opacity:.55}
#notes .nn{font-weight:700;color:#e5484d;margin-right:4px}
#notes .ns{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#777}
#notes .nt{color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#notes .nnote{margin:2px 0}
#notes .nact{display:flex;gap:6px;margin-top:4px}
#notes .nact .nbtn{min-height:30px;font-size:12px;padding:0 8px}
#notes .nfoot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;border-top:1px solid #eee}
#notes .nmsg{flex-basis:100%;color:#166534;font-size:13px}

/* 판 노트 · 사용자 선(modules/view-board-notes.js) — 기존 선(.ar 점선 · .lks 색 선)보다 옅게 */
#bnl{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:-1}   /* 카드 아래 — 카드 사이 빈 곳에서만 보인다 */

.bnote .bh[data-side=top]{left:calc(50% - 5px);top:-6px}.bnote .bh[data-side=bottom]{left:calc(50% - 5px);bottom:-6px}

/* 캔버스 움직임 — transitions-dev 토큰(_root.css 에서 필요한 것만 옮김) + 캔버스 전환을 그 토큰으로.
   build_canvas.py 가 index.html <style> 안 hd-motion 표시 자리에 끼워 넣는다.
   전환마다 @media (prefers-reduced-motion: reduce) 가드, 그리고 '애니메이션 끄기'(body.nomotion)도 같은 효과. */
:root {
  /* Durations */
  --duration-micro: 80ms;
  --duration-quick: 150ms;
  --duration-fast: 250ms;
  --duration-medium: 350ms;
  --duration-slow: 400ms;
  --duration-very-slow: 500ms;
  /* Easings */
  --ease-smooth-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-in-out: ease-in-out;
  --ease-out: ease-out;
  /* Scales · blur */
  --scale-large: 0.96;
  --scale-medium: 0.97;
  --scale-small: 0.98;
  --scale-tiny: 0.99;
  --blur-small: 2px;
  /* Card resize (01) */
  --resize-dur: 300ms;
  --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Menu dropdown (05) */
  --dropdown-open-dur: 250ms;
  --dropdown-close-dur: 150ms;
  --dropdown-pre-scale: 0.97;
  --dropdown-closing-scale: 0.99;
  --dropdown-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Modal open / close (06) */
  --modal-open-dur: 250ms;
  --modal-close-dur: 150ms;
  --modal-scale: 0.96;
  --modal-scale-close: 0.96;
  --modal-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Panel reveal (07) */
  --panel-open-dur: 400ms;
  --panel-close-dur: 350ms;
  --panel-translate-y: 100px;
  --panel-blur: 2px;
  --panel-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Page side-by-side (08) → 카메라 이동 */
  --page-slide-dur: 250ms;
  --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --camera-centre-dur: 250ms;
  --camera-glide-dur: 600ms;
  --camera-ease: cubic-bezier(0.22, 1, 0.36, 1);
  --camera-pulse-dur: 500ms;
  /* Focus enter / exit */
  --focus-dur: 250ms;
  --focus-draw-dur: 400ms;
  --focus-ease: cubic-bezier(0.22, 1, 0.36, 1);
  /* Tooltip open/close (17) → 선 위 태그 */
  --tt-in-dur: 150ms;
  --tt-out-dur: 50ms;
  --tt-scale: 0.98;
  --tt-delay: 80ms;
  --tt-in-ease: ease-out;
  --tt-out-ease: ease-out;
}

/* 1. 포커스 진입 / 해제 — 다른 카드 흐리게(불투명도), 색 선은 그려지듯(pathLength=1) */
/* 흐려지는 쪽(진입)은 바로: 전체 보기에서 Shift+클릭하면 카드 iframe 이 한꺼번에 로드되며 한동안 프레임이 안 그려져
   전환이 멈춘 채 남는다(흐려지지 않은 카드). 해제(다시 밝아짐)만 전환. 진입의 움직임은 선이 그려지는 것으로. */
#rows .card { transition: opacity var(--focus-dur) var(--focus-ease); }
#rows.focusing .card { transition: none; }
svg.lks path.lk { stroke-dasharray: 1; animation: hd-draw var(--focus-draw-dur) var(--focus-ease) backwards; }
svg.lks path.lk { transition: opacity var(--duration-quick) var(--focus-ease); }
@keyframes hd-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@media (prefers-reduced-motion: reduce) {
  #rows .card, svg.lks path.lk { transition: none !important; animation: none !important; }
}

/* 2. 카드 펼치기 / 접기 (01-card-resize) */
.phone {
  transition:
    width  var(--resize-dur) var(--resize-ease),
    height var(--resize-dur) var(--resize-ease);
}
@media (prefers-reduced-motion: reduce) {
  .phone { transition: none !important; }
}

/* 3. 카메라 이동 — 움직임은 JS(requestAnimationFrame, --camera-* 를 읽음). 도착한 카드 테두리 한 번 맥박 */
.card.pulse::after {
  content: ''; position: absolute; left: 0; top: 0; width: 375px; height: var(--ph, 812px); border-radius: 28px; pointer-events: none; z-index: 3;
  animation: hd-pulse var(--camera-pulse-dur) var(--camera-ease) both;
}
@keyframes hd-pulse {
  0%   { box-shadow: 0 0 0 0 var(--ring, #2563eb); opacity: 1; }
  60%  { box-shadow: 0 0 0 22px var(--ring, #2563eb); opacity: .55; }
  100% { box-shadow: 0 0 0 30px var(--ring, #2563eb); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .card.pulse::after { animation: none !important; }
}

/* 4. 크게 보기 모달 열기 / 닫기 (06-modal) — 닫을 때는 hidden 이 먼저 켜지고 .is-closing 동안만 보인다 */
#modal:not([hidden]) .box { animation: hd-modal-in var(--modal-open-dur) var(--modal-ease) backwards; }
#modal:not([hidden]) { animation: hd-fade-in var(--modal-open-dur) var(--modal-ease) backwards; }
#modal[hidden].is-closing { display: flex; pointer-events: none; animation: hd-fade-out var(--modal-close-dur) var(--modal-ease) forwards; }
#modal.is-closing .box { animation: hd-modal-out var(--modal-close-dur) var(--modal-ease) forwards; }
@keyframes hd-modal-in { from { transform: scale(var(--modal-scale)); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes hd-modal-out { from { transform: scale(1); opacity: 1; } to { transform: scale(var(--modal-scale-close)); opacity: 0; } }
@keyframes hd-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes hd-fade-out { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  #modal, #modal .box { animation: none !important; }
  #modal[hidden].is-closing { display: none; }
}

/* 5. 범례 패널 표시 (07-panel-reveal) */
#legend:not([hidden]) { animation: hd-panel-in var(--panel-open-dur) var(--panel-ease) backwards; }
@keyframes hd-panel-in {
  from { transform: translateY(var(--panel-translate-y)); opacity: 0; filter: blur(var(--panel-blur)); }
  to   { transform: translateY(0); opacity: 1; filter: blur(0); }
}
@media (prefers-reduced-motion: reduce) {
  #legend { animation: none !important; }
}

/* 6. 드롭다운 / 팝오버 (05-menu-dropdown) — 색 드롭다운(위로 열림) · 쌍 색 팝오버 · 메모 팝오버 · 전환 메뉴 */
.t-dropdown { transform-origin: top left; }
.t-dropdown[data-origin="top-right"]   { transform-origin: top right; }
.t-dropdown[data-origin="bottom-left"] { transform-origin: bottom left; }
.t-dropdown.is-open { animation: hd-dd-in var(--dropdown-open-dur) var(--dropdown-ease) backwards; }
.t-dropdown.is-closing { animation: hd-dd-out var(--dropdown-close-dur) var(--dropdown-ease) forwards; pointer-events: none; }
#pop:not([hidden]) { transform-origin: top left; animation: hd-dd-in var(--dropdown-open-dur) var(--dropdown-ease) backwards; }
@keyframes hd-dd-in { from { transform: scale(var(--dropdown-pre-scale)); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes hd-dd-out { from { transform: scale(1); opacity: 1; } to { transform: scale(var(--dropdown-closing-scale)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .t-dropdown, #pop { animation: none !important; }
}

/* 7. 태그 · 툴팁 등장 (17-tooltip) — 선 위 태그 · 단축키 안내 */
.ltag.on { animation: hd-tt-in var(--tt-in-dur) var(--tt-in-ease) var(--tt-delay) backwards; }
.ltag { transition: opacity var(--tt-out-dur) var(--tt-out-ease); }
#khint { animation: hd-tt-in var(--tt-in-dur) var(--tt-in-ease) var(--tt-delay) backwards; }
@keyframes hd-tt-in { from { opacity: 0; scale: var(--tt-scale); } to { opacity: 1; scale: 1; } }
@media (prefers-reduced-motion: reduce) {
  .ltag, #khint { transition: none !important; animation: none !important; }
}

/* 애니메이션 끄기(전환 메뉴 체크, prefs.motion=false) — 움직임 줄이기와 같다 */
body.nomotion *, body.nomotion *::after { transition: none !important; animation: none !important; }
body.nomotion #modal[hidden].is-closing { display: none; }

</style>

  addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeDropdown(); closeMenu(sw); } });
  applyWidth(); renderStyle();

  // 펼치기 보여 주기(전환 메뉴 ▶): 펼쳤다가 접기
  function demoExpand(id) {

          cardEl: cardEl, demoExpand: demoExpand, openDropdown: openDropdown, closeDropdown: closeDropdown};
}

HD.viewLinks = {mount: mount};
})();

<script data-hd-module="view-motion">
/* View — 움직임: Ctrl/Cmd+클릭 "어디로 가나" 카메라 · 전환 메뉴(T) · 애니메이션 끄기.

  {id: 'expand', name: '카드 펼치기 / 접기', where: '긴 화면 연결 보기', dur: '--resize-dur', ease: '--resize-ease', basis: '01-card-resize'},
  {id: 'camera', name: '카메라 이동', where: 'Ctrl+클릭', dur: '--camera-glide-dur', ease: '--camera-ease', basis: '08-page-side-by-side'},
  {id: 'modal', name: '크게 보기 모달 열기/닫기', where: '화면 클릭', dur: '--modal-open-dur', ease: '--modal-ease', basis: '06-modal'},
  {id: 'legend', name: '범례 패널 표시', where: '연결 보기 범례', dur: '--panel-open-dur', ease: '--panel-ease', basis: '07-panel-reveal'},
  {id: 'dropdown', name: '드롭다운 / 팝오버', where: '색 드롭다운 · 메모 · 이 메뉴', dur: '--dropdown-open-dur', ease: '--dropdown-ease', basis: '05-menu-dropdown'},
  {id: 'tooltip', name: '태그·툴팁 등장', where: '선 위 태그 · 단축키 안내', dur: '--tt-in-dur', ease: '--tt-in-ease', basis: '17-tooltip'}
];

function mount(ctx) {
  var C = HD.camera, VL = ctx.VL, pane = ctx.pane, CARD = ctx.CARD, $ = ctx.$, $$ = ctx.$$, esc = ctx.esc, root = document.documentElement;
  var raf = 0, anim = null, pulseT = 0;
  var menu = $('#tmenu'), btn = $('#tbtn');

  function css(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
  function msOf(name, d) { return C.ms(css(name), d); }
  function reduced() {

    try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; }
  }
  function setMotion(on) {
    ctx.prefs.motion = !!on; ctx.savePrefs();

    var cb = $('#tmOff'); if (cb) cb.checked = !on;
  }

  /* ---------- 좌표: 화면(client) → 판(stage) ---------- */
  function toStage(cx, cy) { var r = pane.getBoundingClientRect(), v = ctx.getView(); return {x: (cx - r.left - v.tx) / v.z, y: (cy - r.top - v.ty) / v.z}; }
  function phoneBox(id) {

    stop();

    var lk = VL.state().links; if (!lk || lk.order[k] == null) return false;
    var it = null;
    lk.items.forEach(function (x) { if (!it && x.ci === k) it = x; });
    return go(elemPoint(lk.from, it && it.rect), lk.order[k]);
  }
  function frameCard(win) {
    var hit = null;
    $$('.card', ctx.rowsEl).forEach(function (c) { var f = $('.phone iframe', c); if (f && f.contentWindow === win) hit = c.dataset.id; });
    return hit;
  }

    var f = $('.phone iframe', card); if (!f || !f.contentWindow || f.hasAttribute('data-src')) return;
    var r = $('.phone', card).getBoundingClientRect(), s = r.width / CARD.w;

  }

    var d = e.data; if (!d || typeof d !== 'object' || d.type !== 'hd-link-go' || !d.to) return;

    if (!id || !VL.cardEl(id) || !VL.cardEl(String(d.to))) return;
    if (!VL.focusId()) VL.dispatch({type: 'pair', id: id, to: String(d.to)});   // 연결 보기 밖: 그 쌍 하나만 강조
    go(elemPoint(id, inModal ? null : d.rect), String(d.to));
  });

  /* ---------- 전환 메뉴 ---------- */
  function renderMenu() {
    menu.innerHTML = '<h2>전환<\/h2>' + TRANSITIONS.map(function (x) {
      return '<div class="trow" data-t="' + x.id + '" title="' + esc(x.basis) + '"><span class="tn">' + esc(x.name) + '<\/span><span class="tw">' + esc(x.where) + '<\/span>' +
        '<span class="tv" title="' + esc(x.dur + ' · ' + x.ease) + '">' + esc(css(x.dur) + ' · ' + css(x.ease)) + '<\/span>' +
        '<button type="button" class="tplay" data-play="' + x.id + '">▶ 보기<\/button><\/div>';
    }).join('') + '<label class="toff"><input type="checkbox" id="tmOff"' + (ctx.prefs.motion === false ? ' checked' : '') + '> 애니메이션 끄기<\/label>';
  }
  function openMenu() {

  });

    if (ctx.typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
    if ((e.key || '').toLowerCase() === 't' && !ctx.modalOpen() && document.body.dataset.tab === 'screens') { e.preventDefault(); toggleMenu(); }
  });

  // ▶ 보기: 진짜 요소에서 그 전환을 다시 한다

    } else if (id === 'camera') {

    } else if (id === 'legend') {
      if (!lg.hidden) { lg.hidden = true; void lg.offsetWidth; lg.hidden = false; }
      else VL.dispatch({type: 'focus', id: ids[0]});
    } else if (id === 'dropdown') {
      if (!lg.hidden) { VL.openDropdown(); setTimeout(VL.closeDropdown, 900); }
      else closeMenu(function () { setTimeout(openMenu, 60); });
    } else if (id === 'tooltip') {
      var tags = $$('#lkl .ltag.on'), kh = $('#khint');
      tags.forEach(function (n) { n.style.animation = ''; n.classList.remove('on'); });
      if (kh) { kh.style.animation = 'none'; void kh.offsetWidth; kh.style.animation = ''; }
      void root.offsetWidth;
      tags.forEach(function (n) { n.classList.add('on'); });
      if (!tags.length && !fid) VL.dispatch({type: 'focus', id: ids[0]});

  }

  setMotion(ctx.prefs.motion !== false);
  return {ctrlClick: ctrlClick, stop: stop, go: go, replay: replay, toggleMenu: toggleMenu, TRANSITIONS: TRANSITIONS};
}

})();

<script data-hd-module="view-board-notes">
/* View — 판 노트와 사용자 선의 DOM: #stage 안 선 층(svg.bnl)·노트 층(#bnotes) 그리기, 만들기·제자리 쓰기·끌기·잇기·고르기·지우기·선 이름·복사 단추.
   규칙은 HD.boardNotes(Model). 상태 = 판 하나(저장은 판만) · 고른 것({kind:'note'|'edge', id}) · 쓰는 중 · 끄는 중.
   선 = 보이는 층 svg#bnl(카드 아래) + 누르는 층 svg#bnh(카드 위, 카드 상자를 뚫은 clip). 저장: localStorage '<NAME>:<주소 해시>:<프로젝트 도장>' — 기존 메모(hd-notes:)와 따로. 기존 선(svg.ar·svg.lks)·태그·메모·'보내기'는 건드리지 않는다.
   HD.viewBoardNotes.mount(ctx) → {board(), render(), copyText(), selected()}
   ctx = {D, pane, stage, rowsEl, $, $$, esc, getView(), setView(z, tx, ty), typing(e), outDir(), copy(text)} */
(function () {
'use strict';
var HD = globalThis.HD = globalThis.HD || {};
var SVGNS = 'http://www.w3.org/2000/svg', EDIT_Z = 0.6;

function mount(ctx) {
  var M = HD.boardNotes, $ = ctx.$, $$ = ctx.$$, esc = ctx.esc, pane = ctx.pane, stage = ctx.stage, rowsEl = ctx.rowsEl, D = ctx.D || {};
  var KEY = M.NAME + ':' + M.hash(location.pathname) + ':' + M.stamp(D);
  var B = load(), sel = null, editing = null, drag = null, link = null, raf = 0;
  var TITLES = {};
  (D.rows || []).forEach(function (row) { (row.screens || []).forEach(function (s) { TITLES[s.id] = s.title; }); });

  function svgLayer(id) {
    var s = document.createElementNS(SVGNS, 'svg');
    s.id = id; s.setAttribute('width', '1'); s.setAttribute('height', '1');
    return s;
  }
  // 보이는 선 = 카드 아래 층(#bnl) · 누르는 자리와 이름 = 카드 위 층(#bnh, 카드 상자를 뚫은 clip — 카드 클릭은 그대로 카드로 간다)
  var svg = svgLayer('bnl'), hit = svgLayer('bnh');
  svg.innerHTML = '<defs><marker id="bn-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">' +
                  '<path d="M0,0 L10,5 L0,10 z"/><\/marker><\/defs><g class="bl-all"><\/g><path class="bl tmp" style="display:none"/>';
  hit.innerHTML = '<defs><clipPath id="bn-clip" clipPathUnits="userSpaceOnUse"><path clip-rule="evenodd"/><\/clipPath><\/defs><g class="bh-all" clip-path="url(#bn-clip)"><\/g>';
  var layer = document.createElement('div'); layer.id = 'bnotes';
  stage.appendChild(svg); stage.appendChild(hit); stage.appendChild(layer);
  var tmp = $('path.tmp', svg), all = $('g.bl-all', svg), hall = $('g.bh-all', hit), clip = $('#bn-clip path', hit);

  var copyBtn = document.createElement('button');
  copyBtn.className = 'vbtn'; copyBtn.id = 'bncopy'; copyBtn.type = 'button'; copyBtn.hidden = true;
  copyBtn.title = '판 노트와 선을 글로 복사 — AI 대화에 붙여 넣어요'; copyBtn.textContent = '판 노트 복사';
  var view = $('.view[data-group="view"]'); if (view) view.insertBefore(copyBtn, view.firstChild);
  copyBtn.addEventListener('click', function () {
    ctx.copy(copyText());
    copyBtn.textContent = '복사했어요'; setTimeout(function () { copyBtn.textContent = '판 노트 복사'; }, 1400);
  });

  function load() {
    var raw = null; try { raw = localStorage.getItem(KEY); } catch (e) {}   // 저장소를 못 읽는 브라우저 = 빈 판
    var r = M.parse(raw);
    if (r.bad) console.warn('[hd] 판 노트 저장값 ' + (r.bad === 'broken' ? '깨짐 — 빈 판으로' : '일부 빠짐'));
    return r.board;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(B)); } catch (e) {} }   // 저장 실패(용량·사생활 모드)는 화면 상태만 남긴다
  function now() { return Date.now(); }
  function z() { return ctx.getView().z; }
  function toStage(cx, cy) { var r = stage.getBoundingClientRect(), k = z(); return {x: (cx - r.left) / k, y: (cy - r.top) / k}; }
  function boxOf(el) {                               // 판 좌표 상자(변환 아래에서도 맞게 화면 좌표에서 되돌린다)
    var r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), k = z();
    return {x: (r.left - s.left) / k, y: (r.top - s.top) / k, w: r.width / k, h: r.height / k};
  }
  function cardEl(id) { return $$('.card', rowsEl).filter(function (c) { return c.dataset.id === id; })[0] || null; }
  function screenBox(id) { var c = cardEl(id), p = c && $('.phone', c); return p ? boxOf(p) : null; }
  function noteEl(id) { return $$('.bnote', layer).filter(function (n) { return n.dataset.id === id; })[0] || null; }
  function endBox(key) {
    if (key.indexOf('note:') === 0) { var el = noteEl(key.slice(5)); return el ? boxOf(el) : null; }
    return screenBox(key.slice(7));
  }
  function chain(el) {
    var out = [];
    for (var n = el; n && n !== document.documentElement; n = n.parentElement) {
      var t = [n.tagName.toLowerCase()];
      if (n.id) t.push('#' + n.id);
      (n.getAttribute('class') || '').split(/\s+/).filter(Boolean).forEach(function (c) { t.push('.' + c); });
      out.push(t);
      if (n === pane) break;
    }
    return out;
  }

  /* ---------- 그리기 ---------- */
  function renderNotes() {
    var keep = {};
    Object.keys(B.notes).forEach(function (id) {
      var n = B.notes[id], el = noteEl(id);
      if (!el) {
        el = document.createElement('div'); el.className = 'bnote'; el.dataset.id = id;
        el.innerHTML = '<div class="bt"><\/div>' + M.SIDES.map(function (s) { return '<i class="bh" data-side="' + s + '"><\/i>'; }).join('');
        layer.appendChild(el);
      }
      el.style.left = n.x + 'px'; el.style.top = n.y + 'px'; el.style.width = n.w + 'px';
      if (editing !== id) $('.bt', el).textContent = n.text;
      el.classList.toggle('sel', !!sel && sel.kind === 'note' && sel.id === id);
      keep[id] = 1;
    });
    $$('.bnote', layer).forEach(function (el) { if (!keep[el.dataset.id] && editing !== el.dataset.id) el.remove(); });
    copyBtn.hidden = !Object.keys(B.notes).length;
  }
  function renderEdges() {
    var h = '', hh = '', holes = 'M-100000,-100000 H100000 V100000 H-100000 Z';
    $$('.card', rowsEl).forEach(function (c) { var b = boxOf(c); holes += ' M' + b.x.toFixed(1) + ',' + b.y.toFixed(1) + ' h' + b.w.toFixed(1) + ' v' + b.h.toFixed(1) + ' h' + (-b.w).toFixed(1) + ' Z'; });
    clip.setAttribute('d', holes);
    M.live(B, function (id) { return !!cardEl(id); }).forEach(function (e) {
      var a = endBox(e.from), b = endBox(e.to); if (!a || !b) return;
      var p = M.anchor(a, e.fromSide), q = M.anchor(b, e.toSide), d = M.path(p, e.fromSide, q, e.toSide);
      var on = sel && sel.kind === 'edge' && sel.id === e.id ? ' sel' : '', id = esc(e.id);
      h += '<path class="bl' + on + '" data-id="' + id + '" d="' + d + '"/>';
      hh += '<g class="be' + on + '" data-id="' + id + '"><path class="bhit" d="' + d + '"/>' +
            (e.label ? '<text class="blab" x="' + ((p.x + q.x) / 2).toFixed(1) + '" y="' + ((p.y + q.y) / 2 - 6).toFixed(1) + '">' + esc(e.label) + '<\/text>' : '') + '<\/g>';
    });
    all.innerHTML = h; hall.innerHTML = hh;
  }
  function render() { renderNotes(); renderEdges(); }
  function schedule() { if (raf) return; raf = requestAnimationFrame(function () { raf = 0; renderEdges(); }); }

  /* ---------- 고르기·지우기 ---------- */
  function select(s) { sel = s; render(); }
  function removeSelected() {
    if (!sel) return;
    if (sel.kind === 'note') B = M.removeNote(B, sel.id); else B = M.unlink(B, sel.id);
    sel = null; save(); render();
  }

  /* ---------- 쓰기 ---------- */
  function edit(id) {
    var el = noteEl(id); if (!el || editing) return;
    var v = ctx.getView();
    if (v.z < EDIT_Z) {                              // 너무 작게 보고 있으면 노트 자리를 둔 채 읽히는 배율로
      var r = pane.getBoundingClientRect(), b = el.getBoundingClientRect(), px = b.left - r.left, py = b.top - r.top;
      var bx = (px - v.tx) / v.z, by = (py - v.ty) / v.z;
      ctx.setView(EDIT_Z, px - bx * EDIT_Z, py - by * EDIT_Z);
    }
    editing = id; select({kind: 'note', id: id});
    var bt = $('.bt', el), ta = document.createElement('textarea');
    ta.className = 'bta'; ta.value = B.notes[id] ? B.notes[id].text : ''; ta.setAttribute('aria-label', '판 노트');
    bt.hidden = true; el.insertBefore(ta, bt);
    var grow = function () { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px'; };
    ta.addEventListener('input', function () { grow(); schedule(); });
    ta.addEventListener('keydown', function (e) {
      if (e.isComposing) return;                     // 한글 조합 중 키는 건드리지 않는다
      if (e.key === 'Escape' || (e.key === 'Enter' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); e.stopPropagation(); done(); }
    });
    ta.addEventListener('blur', function () { done(); });
    ta.addEventListener('pointerdown', function (e) { e.stopPropagation(); });
    var ended = false;
    function done() {
      if (ended) return; ended = true;
      var r = M.finish(B, id, ta.value, now());
      editing = null; ta.remove(); bt.hidden = false;
      B = r.board;
      if (r.kind === 'drop') sel = null;
      if (r.kind !== 'same') save();
      render();
    }
    grow(); ta.focus();
  }

  /* ---------- 만들기: 빈 판 두 번 누르기 ---------- */
  pane.addEventListener('dblclick', function (e) {
    var where = M.spot(chain(e.target));
    if (where === 'note') return;                    // 노트 위 두 번 누르기는 노트가 받는다
    if (where !== 'empty' || editing) return;
    var pt = toStage(e.clientX, e.clientY), boxes = $$('.card', rowsEl).map(function (c) { var b = boxOf(c); return {x0: b.x, y0: b.y, x1: b.x + b.w, y1: b.y + b.h}; });
    var at = M.room(pt, boxes); if (!at.free) return;
    e.preventDefault();
    var id = M.newId('n', now());
    B = M.create(B, id, at, now());                  // 글이 생기기 전에는 저장하지 않는다(finish 가 판정)
    sel = {kind: 'note', id: id}; render(); edit(id);
  });

  /* ---------- 노트: 고르기·끌기·잇기 ---------- */
  layer.addEventListener('pointerdown', function (e) {
    var el = e.target.closest('.bnote'); if (!el || (e.pointerType === 'mouse' && e.button !== 0)) return;
    e.stopPropagation();                             // 판 끌기로 새지 않게
    var id = el.dataset.id, h = e.target.closest('.bh');
    if (editing === id) return;
    if (h) {                                         // 변의 점 끌기 = 잇기
      e.preventDefault();
      link = {from: 'note:' + id, side: h.dataset.side, pid: e.pointerId};
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      return;
    }
    var n = B.notes[id]; if (!n) return;
    drag = {id: id, pid: e.pointerId, sx: e.clientX, sy: e.clientY, x: n.x, y: n.y, moved: false};
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    if (!sel || sel.id !== id) select({kind: 'note', id: id});
  });
  layer.addEventListener('pointermove', function (e) {
    if (link && link.pid === e.pointerId) {
      var a = endBox(link.from); if (!a) return;
      var p = M.anchor(a, link.side), q = toStage(e.clientX, e.clientY);
      tmp.setAttribute('d', M.path(p, link.side, q, M.nearSide({x: q.x, y: q.y, w: 0, h: 0}, p)));
      tmp.style.display = '';
      return;
    }
    if (!drag || drag.pid !== e.pointerId) return;
    var k = z(), dx = (e.clientX - drag.sx) / k, dy = (e.clientY - drag.sy) / k;
    if (!drag.moved && Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) <= 4) return;
    drag.moved = true;
    var el = noteEl(drag.id); if (el) { el.style.left = Math.round(drag.x + dx) + 'px'; el.style.top = Math.round(drag.y + dy) + 'px'; }
    schedule();
  });
  function endPointer(e) {
    if (link && link.pid === e.pointerId) {
      tmp.style.display = 'none';
      var hit = document.elementFromPoint(e.clientX, e.clientY), ne = hit && hit.closest('.bnote'), ce = hit && hit.closest('.card');
      var to = ne ? 'note:' + ne.dataset.id : ce ? 'screen:' + ce.dataset.id : null;
      if (to) {
        var src = endBox(link.from), dst = endBox(to);
        var toSide = dst ? M.nearSide(dst, M.anchor(src, link.side)) : 'left';
        var r = M.connect(B, M.newId('e', now()), link.from, link.side, to, toSide, now());
        if (r.ok) { B = r.board; save(); }
      }
      link = null; render();
      return;
    }
    if (!drag || drag.pid !== e.pointerId) return;
    var d = drag; drag = null;
    if (!d.moved) return;
    var k = z();
    B = M.move(B, d.id, d.x + (e.clientX - d.sx) / k, d.y + (e.clientY - d.sy) / k, now());
    save(); render();
  }
  layer.addEventListener('pointerup', endPointer);
  layer.addEventListener('pointercancel', endPointer);
  layer.addEventListener('dblclick', function (e) {
    var el = e.target.closest('.bnote'); if (!el) return;
    e.stopPropagation(); e.preventDefault(); edit(el.dataset.id);
  });

  /* ---------- 선: 고르기·이름 ---------- */
  hit.addEventListener('pointerdown', function (e) { if (e.target.closest('g.be')) e.stopPropagation(); });
  hit.addEventListener('click', function (e) {
    var g = e.target.closest('g.be'); if (!g) return;
    e.stopPropagation(); select({kind: 'edge', id: g.dataset.id});
  });
  hit.addEventListener('dblclick', function (e) {
    var g = e.target.closest('g.be'); if (!g) return;
    e.stopPropagation(); e.preventDefault();
    var id = g.dataset.id, ed = B.edges[id]; if (!ed) return;
    var a = endBox(ed.from), b = endBox(ed.to); if (!a || !b) return;
    var p = M.anchor(a, ed.fromSide), q = M.anchor(b, ed.toSide);
    var inp = document.createElement('input');
    inp.className = 'blin'; inp.value = ed.label || ''; inp.maxLength = M.LABEL_MAX; inp.setAttribute('aria-label', '선 이름');
    inp.style.left = ((p.x + q.x) / 2) + 'px'; inp.style.top = ((p.y + q.y) / 2 - 14) + 'px';
    layer.appendChild(inp);
    var ended = false;
    var fin = function (keep) { if (ended) return; ended = true; if (keep) { B = M.label(B, id, inp.value, now()); save(); } inp.remove(); render(); };
    inp.addEventListener('keydown', function (ev) {
      if (ev.isComposing) return;
      if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); fin(true); }
      else if (ev.key === 'Escape') { ev.preventDefault(); ev.stopPropagation(); fin(false); }
    });
    inp.addEventListener('blur', function () { fin(true); });
    inp.addEventListener('pointerdown', function (ev) { ev.stopPropagation(); });
    inp.focus(); inp.select();
  });

  /* ---------- 빈 곳 누르기 = 고르기 풂 · Delete = 지우기 ---------- */
  pane.addEventListener('click', function (e) {
    if (sel && !e.target.closest('.bnote') && !e.target.closest('g.be')) select(null);
  });
  addEventListener('keydown', function (e) {
    if (!sel || editing || ctx.typing(e)) return;
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); removeSelected(); }
    else if (e.key === 'Enter' && sel.kind === 'note') { e.preventDefault(); edit(sel.id); }
  });

  /* ---------- 카드 크기가 바뀌면(긴 화면 펼치기 등) 선 끝을 다시 ---------- */
  if (typeof ResizeObserver === 'function') {
    var ro = new ResizeObserver(schedule);
    $$('.card', rowsEl).forEach(function (c) { ro.observe(c); });
  }

  function copyText() {
    var boxes = {}, heights = {};
    $$('.card', rowsEl).forEach(function (c) { var b = screenBox(c.dataset.id); if (b) boxes[c.dataset.id] = b; });
    Object.keys(B.notes).forEach(function (id) { var el = noteEl(id); if (el) heights[id] = boxOf(el).h; });
    return M.copyText(B, {out: ctx.outDir(), boxes: boxes, titles: TITLES, heights: heights});
  }

  render();
  return {board: function () { return B; }, render: render, copyText: copyText, selected: function () { return sel; }};
}

HD.viewBoardNotes = {mount: mount};
})();
</script>
<script>
(function () {
'use strict';
// ── Canvas shell: data, board content, zoom/pan, modal, tabs, palette, notes (legacy, untouched). 연결 보기는 modules/*.js(HD.*)
var D = JSON.parse(document.getElementById('hd-data').textContent || '{}');
var Z0 = D.scale || 0.72, ZMIN = 0.02, ZMAX = 1.5;
var CARD = D.card || {w: 375, h: 812}, MW = (D.modal || {}).w || 390, MH = (D.modal || {}).h || 844;
var LEFT = 300;                                  // 카드 왼쪽 통로(줄을 넘는 화살표가 지나는 곳)
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };

if (D.title) { $('#title').textContent = D.title; document.title = D.title; }
var pane = $('#screens'), stage = $('#stage'), rowsEl = $('#rows');

/* ---------- 판 내용 ---------- */
var intro = '';
var st = D.story;
if (st && (st.headline || st.summary)) {
  var head = esc(st.headline).replace(/&lt;(\/?)em&gt;/g, '<$1em>');
  intro += '<section class="story"><h2>' + head + '</h2>' + (st.summary ? '<p class="sum">' + esc(st.summary) + '</p>' : '') +
    '<div class="ideas">' + (st.ideas || []).slice(0, 3).map(function (d) {
      return '<div class="idea"><b>' + esc(d.title) + '</b><p>' + esc(d.desc) + '</p></div>'; }).join('') + '</div>' +
    ((D.people || []).length ? '<div class="people"><h3>누구를 위한 앱인가</h3><ul>' + D.people.map(function (p) {
      return '<li><b>' + esc(p.name) + (p.core ? ' · 핵심' : '') + '</b>' + esc(p.why) + '<span class="win">→ ' + esc(p.win) + '</span>' + '</li>'; }).join('') + '</ul></div>' : '') + '</section>';
}
var dc = D.decisions;
if (dc && ((dc.items || []).length || dc.core)) {
  intro += '<section class="decisions"><h3>정한 것 · 뺀 것</h3>' + (dc.core ? '<p class="core">' + esc(dc.core) + '</p>' : '') +
    '<ul>' + (dc.items || []).map(function (i) {
      return '<li><span class="v v-' + esc(i.verdict) + '">' + esc(i.label) + '</span><b>' + esc(i.name) + '</b>' +
        (i.how ? ' → ' + esc(i.how) : '') + '<span class="why">' + esc(i.why) + '</span></li>'; }).join('') + '</ul>' +
    ((dc.market || []).length ? '<h3 class="mk">시장 관례 — 따른 것 · 벗어난 것</h3><ul>' + dc.market.map(function (i) {
      return '<li><span class="v v-' + esc(i.verdict) + '">' + esc(i.label) + '</span><b>' + esc(i.name) + '</b>' +
        '<span class="why">' + esc(i.verdict === 'cut' ? i.why : (i.how || i.why)) + '</span></li>'; }).join('') + '</ul>' : '') + '</section>';
}
$('#intro').innerHTML = '<p class="hint">끌어서 둘러보고, 화면을 누르면 크게 보고 직접 눌러볼 수 있어요 · 점선은 주요 흐름' + (D.stage === 'go' && D.pending ? ' · 오류·확인·빈 화면 같은 상태 ' + D.pending + '개는 <b>/hyper-design:max</b>로 더할 수 있어요' : '') + '</p><div class="intro-grid">' + intro + '</div>';
$('#intro').style.marginLeft = LEFT + 'px';

var html = '<svg class="ar" id="ar" width="1" height="1"><defs><marker id="hd-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs></svg>';
(D.rows || []).forEach(function (row) {
  html += '<div class="flow"><div class="glabel">' + esc(row.group) + '</div><div class="cards">';
  row.screens.forEach(function (s) {
    var pol = s.policies || [];
    var shown = pol.slice(0, 3).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('');
    var more = pol.length > 3 ? '<details class="more"><summary>정책 ' + (pol.length - 3) + '개 더</summary><ul class="pol">' +
      pol.slice(3).map(function (p) { return '<li>' + esc(p) + '</li>'; }).join('') + '</ul></details>' : '';
    html += '<div class="card" data-id="' + esc(s.id) + '"><div class="phone"><iframe scrolling="no" tabindex="-1" title="' + esc(s.title) +
      '" data-src="' + esc(s.file) + '"></iframe><button class="cover" data-file="' + esc(s.file) + '" data-title="' + esc(s.title) +

  });

  flow.forEach(function (a) { per[a.from] = (per[a.from] || 0) + 1; });
  flow.forEach(function (a) {

    var j = seen[a.from] || 0, n = per[a.from]; seen[a.from] = j + 1;
    var sx = s.x + CARD.w / 2 + (j - (n - 1) / 2) * 28, tx = t.x + CARD.w / 2;
    if (Math.abs(sx - tx) < 3 * RADIUS) sx = tx + (tx > s.x + CARD.w / 2 - 1 ? -1 : 1) * (CARD.w / 2 - 40);   // 같은 칸(위아래 줄): 세로선이 겹치지 않게
    var same = s.row === t.row, d;

var z = Z0, tx = 0, ty = 0;

  rowsEl.style.setProperty('--lw', Math.max(2, 1.2 / z).toFixed(2));   // 기본 2 · 작게 봐도 화면에서 1.2px 아래로 가늘어지지 않게
  var ts = tagScale();                             // 선 위 태그: 작게 볼 때 화면에서 읽히는 크기로(겹침 상자도 다시 잰다)
  rowsEl.style.setProperty('--ts', ts.toFixed(3));
  if (Math.abs(ts - lastTs) > 0.02) { lastTs = ts; clearTimeout(tsT); tsT = setTimeout(function () { if (VL && VL.focusId()) VL.render(true); }, 120); }
  scheduleVisible();
}
var lastTs = 1, tsT = 0;
function tagScale() { return Math.max(1, 0.75 / z); }   // 글자 16·0.75 = 12px, 테두리 2·0.75 = 1.5px(화면)
var fitMin = ZMIN;                                // 전체 보기가 ZMIN 보다 작아야 하면 그만큼은 허용
function clampZ(v) { return Math.min(ZMAX, Math.max(fitMin, v)); }
function zoomAt(px, py, nz) {

}
function home() {

}
function setIntent(v) { $$('#pop .seg button').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.intent === v)); }); }
function curIntent() { var b = $('#pop .seg button[aria-pressed="true"]'); return b ? b.dataset.intent : 'change'; }
$$('#pop .seg button').forEach(function (b) { b.addEventListener('click', function () { setIntent(b.dataset.intent); }); });
function showPop(item, note, intent) {
  $('#ptitle').textContent = item.text || '(글자 없음)';
  $('#ppath').textContent = item.path || '';
  $('#pnote').value = note || '';
  setIntent(intent || 'change');
  $('#padd').textContent = editing ? '저장' : '추가';
  pop.hidden = false; placePop(item.rect);
  $('#pnote').focus();
}
function hidePop() { pop.hidden = true; draft = null; editing = null; drawPins(); }
function commitPop() {
  var note = $('#pnote').value.trim(), intent = curIntent();
  if (editing) {
    var n = notes.filter(function (x) { return x.id === editing; })[0];
    if (n) { n.note = note; n.intent = intent; n.sent = false; }
  } else if (draft) {
    var t0 = draft.targets[0];
    notes.push({id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), screen: draft.screen, targets: draft.targets.slice(),
                path: t0.path, text: t0.text, rect: t0.rect, note: note, intent: intent, sent: false});
  }
  hidePop(); saveNotes();
}
$('#padd').addEventListener('click', commitPop);
$('#pcancel').addEventListener('click', hidePop);
$('#pnote').addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); commitPop(); } });
addEventListener('message', function (e) {
  var d = e.data; if (!d || typeof d !== 'object' || e.source !== mframe.contentWindow) return;
  if (d.type === 'hd-picked' && picking) {
    if (d.screen) mscreen = String(d.screen);
    var it = {path: String(d.path || ''), text: String(d.text || '').slice(0, 60), rect: d.rect || null};
    if (d.add && draft && !editing && !pop.hidden) {   // Shift+클릭: 고른 묶음에 더하거나 빼기
      var note = $('#pnote').value, intent = curIntent(), at = -1;
      draft.targets.forEach(function (t, i) { if (t.path === it.path) at = i; });
      if (at >= 0) draft.targets.splice(at, 1); else draft.targets.push(it);
      if (!draft.targets.length) { hidePop(); return; }
      drawPins(); showPop(popItem(draft, it), note, intent);
      return;
    }
    editing = null;
    draft = {screen: String(d.screen || mscreen || ''), targets: [it]};
    drawPins(); showPop(popItem(draft, it), '', 'change');
  }
});
function drawPins() {
  var layer = $('#mpins'), h = '';
  if (mscreen && !modal.hidden) notes.forEach(function (n, i) {
    if (n.screen !== mscreen) return;
    tgts(n).forEach(function (t) {
      var r = t.rect, s = mscale; if (!r) return;
      h += '<div class="pin-box" style="left:' + (r.x * s) + 'px;top:' + (r.y * s) + 'px;width:' + (r.w * s) + 'px;height:' + (r.h * s) + 'px"></div>' +
        '<div class="pin" data-n="' + (i + 1) + '" style="left:' + (r.x * s) + 'px;top:' + (r.y * s) + 'px">' + circled(i + 1) + '</div>';
    });
  });
  if (draft && !modal.hidden) draft.targets.forEach(function (t, i) {   // 지금 고른 요소들: 테두리 + 고른 순서
    var r = t.rect, s = mscale; if (!r) return;
    h += '<div class="sel-box" style="left:' + (r.x * s) + 'px;top:' + (r.y * s) + 'px;width:' + (r.w * s) + 'px;height:' + (r.h * s) + 'px"><b>' + (i + 1) + '</b></div>';
  });
  layer.innerHTML = h;
}
function renderNotes() {
  notesEl.hidden = !notes.length;
  $('#ncount').textContent = notes.length ? notes.length + '건' : '';
  $('#nlist').innerHTML = notes.map(function (n, i) {
    return '<li data-id="' + esc(n.id) + '"' + (n.sent ? ' class="sent"' : '') + '><div><span class="nn">' + circled(i + 1) + '</span><span class="ns">' + esc(n.screen) +
      ' · ' + esc(n.intent) + (tgts(n).length > 1 ? ' · ' + tgts(n).length + '개 요소' : '') + (n.sent ? ' · 보냄' : '') + '</span></div><div class="nt">"' + esc(n.text) + '"</div><div class="nnote">' + esc(n.note) + '</div>' +
      '<div class="nact"><button class="nbtn" data-act="edit">고치기</button><button class="nbtn" data-act="del">지우기</button></div></li>';
  }).join('');
  $('#nclear').hidden = !notes.some(function (n) { return n.sent; });
  var cnt = {};
  notes.forEach(function (n) { cnt[n.screen] = (cnt[n.screen] || 0) + 1; });
  $$('.card', rowsEl).forEach(function (c) {
    var b = $('.nbadge', c), k = cnt[c.dataset.id] || 0;
    if (!k) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('span'); b.className = 'nbadge'; $('.phone', c).appendChild(b); }
    b.textContent = k; b.title = '메모 ' + k + '건';
  });
}
$('#nlist').addEventListener('click', function (e) {
  var b = e.target.closest('button[data-act]'); if (!b) return;
  var id = b.closest('li').dataset.id, n = notes.filter(function (x) { return x.id === id; })[0]; if (!n) return;
  if (b.dataset.act === 'del') { notes = notes.filter(function (x) { return x.id !== id; }); if (editing === id) hidePop(); saveNotes(); return; }
  editing = id; draft = null;
  var ts = tgts(n);
  showPop({text: ts.length > 1 ? ts.length + '개 요소 · ' + (ts[0].text || '') : ts[0].text, path: ts.map(function (t) { return t.path; }).join('\n'),
           rect: n.screen === mscreen ? ts[0].rect : null}, n.note, n.intent);
});
function requestText(notesList) {
  var list = [];                                   // 여러 요소 메모는 요소마다 한 항목으로 펼친다(형식은 그대로)
  notesList.forEach(function (n) { tgts(n).forEach(function (t) { list.push({screen: n.screen, path: t.path, text: t.text, intent: n.intent, note: n.note}); }); });
  return '[hyper-design 수정 요청] out=' + outDir() + ' · ' + list.length + '건\n' + list.map(function (n, i) {
    return (i + 1) + '. screen=' + n.screen + ' · path=' + n.path + '\n   text="' + String(n.text).replace(/\s+/g, ' ') + '" · intent=' + n.intent +
      '\n   요청: ' + String(n.note).replace(/\s*\n\s*/g, ' ');
  }).join('\n');
}
function copyText(t) {
  function fallback() {
    var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    ta.remove();
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(fallback);
    else fallback();
  } catch (e) { fallback(); }
}
$('#nsend').addEventListener('click', function () {
  var list = notes.filter(function (n) { return !n.sent; });
  if (!list.length) list = notes.slice();
  if (!list.length) return;
  var t = requestText(list);
  window.__hdLastSend = t;
  copyText(t);
  list.forEach(function (n) { n.sent = true; });
  saveNotes();
  $('#nmsg').textContent = '복사했어요 — 터미널에 붙여넣으세요';
});
$('#nclear').addEventListener('click', function () {
  notes = notes.filter(function (n) { return !n.sent; });
  $('#nmsg').textContent = '';
  saveNotes();
});
addEventListener('keydown', function (e) {
  if (typing(e) || e.ctrlKey || e.metaKey || e.altKey) return;
  var k = (e.key || '').toLowerCase();
  if (k === 'a' && modal.hidden) { e.preventDefault(); setArrows(!arrowsOn); }
  else if (k === '0' && modal.hidden && document.body.dataset.tab === 'screens') { e.preventDefault(); fit(); }
  else if (k === 'p' && !modal.hidden) { e.preventDefault(); setPick(!picking); }
});
renderNotes();

/* ---------- 시작 ---------- */
(function () {                                    // 판 위 글은 첫 배율에서 화면 폭에 들어오게
  var pw = pane.clientWidth, narrow = pw < 600;
  if (narrow) stage.classList.add('narrow');
  var left = narrow ? 12 : 24 + LEFT * Z0;
  var mw = Math.round((pw - left - 24) / Z0) + 'px';
  $('#intro').style.maxWidth = mw; $('#foot').style.maxWidth = mw;
})();
drawArrows();
home();
loadVisible();
var hashTab = (location.hash || '').slice(1);
if (hashTab === 'foundation' || hashTab === 'components') showTab(hashTab);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawArrows(); });
if (window.ResizeObserver) {                       // 글꼴·토큰이 늦게 와서 줄 높이가 바뀌면 화살표를 다시
  var roRaf = 0, roH = 0;
  new ResizeObserver(function () {
    if (rowsEl.offsetHeight === roH) return; roH = rowsEl.offsetHeight;
    cancelAnimationFrame(roRaf); roRaf = requestAnimationFrame(drawArrows);
  }).observe(rowsEl);
}
// 판 노트 · 사용자 선 View(modules/view-board-notes.js) — 빈 판 두 번 누르기 · 변의 점 끌어 잇기 · '판 노트 복사'
var BN = HD.viewBoardNotes.mount({D: D, pane: pane, stage: stage, rowsEl: rowsEl, $: $, $$: $$, esc: esc, typing: typing, outDir: outDir, copy: copyText,
                                  getView: function () { return {z: z, tx: tx, ty: ty}; }, setView: function (nz, ntx, nty) { z = nz; tx = ntx; ty = nty; apply(); }});
window.__hdReady = performance.now();
})();
</script>

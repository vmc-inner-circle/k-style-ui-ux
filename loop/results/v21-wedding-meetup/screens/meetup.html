<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>대학 동기 모임 · 회신 모아보기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
<style>
.tbl-wrap { overflow-x: auto; }
.reply { width: 100%; border-collapse: collapse; font-size: var(--fs-caption); }
.reply th, .reply td { padding: var(--stack-m) var(--stack-s); border-bottom: 1px solid var(--c-line); text-align: center; vertical-align: middle; color: var(--c-text-1); }
.reply thead th { color: var(--c-text-2); font-weight: 600; }
.reply tbody th { text-align: left; font-weight: 600; white-space: nowrap; }
.reply tfoot th, .reply tfoot td { font-weight: 700; border-bottom: 0; }
.mark { display: inline-flex; align-items: center; gap: 2px; white-space: nowrap; }
.mark svg { width: 16px; height: 16px; flex: none; }
.mark.is-yes { color: var(--c-brand-text); }
.mark.is-no { color: var(--c-text-2); }
.mark.is-none { color: var(--c-text-3); }
.soban-field { margin: 0; }
</style>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="meetups.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">대학 동기 모임</h1><a class="appbar-btn" href="meetup-edit.html">고치기</a></header>
<main class="page">
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">가장 많이 모이는 날</h2><span class="badge is-info">확정 앞둠</span></div>
    <div role="radiogroup" aria-label="확정할 날짜">
      <button class="row" role="radio" aria-checked="true">
        <div class="row-main"><p class="row-title">11월 14일(토) 저녁 7시</p><p class="row-sub">가능 4명 · 답한 4명 모두</p><p class="row-sub">같은 날 점심 12시 산악부(신랑 쪽, 확정) — 시간 안 겹침</p></div>
        <span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span></button>
      <button class="row" role="radio" aria-checked="false">
        <div class="row-main"><p class="row-title">11월 21일(토) 저녁 7시</p><p class="row-sub">가능 3명</p><p class="row-sub"><span class="badge is-warning">겹침</span> 회사 개발팀 모임(신랑 쪽, 확정) 저녁 7시</p></div>
        <span class="row-trail"></span></button>
      <button class="row" role="radio" aria-checked="false">
        <div class="row-main"><p class="row-title">11월 15일(일) 점심 12시</p><p class="row-sub">가능 2명</p></div>
        <span class="row-trail"></span></button>
    </div>
  </section>

  <section class="block is-list">
    <div class="block-head"><h2 class="h2">답 없는 사람</h2><span class="block-link">10월 29일 마감 지남</span></div>
    <div class="row">
      <span class="avatar is-text">세</span>
      <div class="row-main"><p class="row-title">오세린 1명</p><p class="row-sub">회신 마감 10월 29일(목)이 지났어요 · 4/5 답함</p></div>
      <span class="row-trail"><button class="btn small secondary">링크 복사</button></span>
    </div>
    <a class="row" href="meetup-edit.html"><div class="row-main"><p class="row-title">더 기다릴게요</p><p class="row-sub">마감 연장</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></a>
  </section>

  <section class="block">
    <div class="block-head"><h2 class="h2">회신표</h2></div>
    <div class="tbl-wrap"><table class="reply">
      <thead><tr><th scope="col">이름</th><th scope="col">11/14(토)<br>저녁 7시</th><th scope="col">11/15(일)<br>점심 12시</th><th scope="col">11/21(토)<br>저녁 7시</th></tr></thead>
      <tbody>
<tr><th scope="row">박민지</th><td><span class="mark is-yes"></span></td><td><span class="mark is-no"></span></td><td><span class="mark is-yes"></span></td></tr>
<tr><th scope="row">최유진</th><td><span class="mark is-yes"></span></td><td><span class="mark is-yes"></span></td><td><span class="mark is-no"></span></td></tr>
<tr><th scope="row">한소라</th><td><span class="mark is-yes"></span></td><td><span class="mark is-no"></span></td><td><span class="mark is-yes"></span></td></tr>
<tr><th scope="row">정다은</th><td><span class="mark is-yes"></span></td><td><span class="mark is-yes"></span></td><td><span class="mark is-yes"></span></td></tr>
<tr><th scope="row">오세린</th><td><span class="mark is-none"> 없음</span></td><td><span class="mark is-none"> 없음</span></td><td><span class="mark is-none"> 없음</span></td></tr>
      </tbody>
      <tfoot><tr><th scope="row">가능</th><td>4명</td><td>2명</td><td>3명</td></tr></tfoot>
    </table></div>
  </section>

  <section class="block">
    <div class="field soban-field"><label class="label" for="pl">장소 (선택)</label><input class="input" id="pl" value="합정역 '소반'" placeholder="장소 이름을 한 줄로 적어요"></div>
  </section>
</main>
<div class="cta"><a class="btn primary full" href="meetup-confirmed.html">11월 14일로 확정하기</a></div>
</body></html>

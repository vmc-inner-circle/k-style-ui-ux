<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>시작 · 결혼식 날짜와 짝꿍</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<main class="page">
  <p class="done">초대 링크를 복사했어요 — 준호님 카톡에 붙여넣으세요</p>
  <div class="photo is-16x9"><img src="../assets/photos/couple-start.jpg" alt="결혼을 준비하는 두 사람"></div>
  <header class="hero">
    <h1 class="title">결혼식 날짜를 알려 주세요</h1>
  </header>
  <div class="field"><label class="label" for="d">결혼식 날짜</label><input class="input" id="d" value="2027년 1월 23일 토 낮 12시"></div>
  <div class="field"><span class="label">나는</span>
    <div class="seg" role="radiogroup"><button class="seg-item is-selected" role="radio" aria-checked="true">신부</button><button class="seg-item" role="radio" aria-checked="false">신랑</button></div>
  </div>
  <div class="field"><label class="label" for="me">내 이름</label><input class="input" id="me" value="김서연"></div>
  <div class="field"><label class="label" for="pt">짝꿍 이름</label><input class="input" id="pt" value="이준호"></div>
  <button class="btn secondary">다시 복사</button>
</main>
<div class="cta"><a class="btn primary full" href="home.html">홈으로</a></div>
</body></html>

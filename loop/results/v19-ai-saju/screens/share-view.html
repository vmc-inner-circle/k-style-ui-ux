<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>받은 궁합 링크</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="has-cta">
<main class="page">
  <header class="hero">
    <p class="eyebrow">결 · 친구 궁합</p>
    <p class="lead">최서아님이 10월 28일 보낸 궁합이에요</p>
  </header>
  <section class="block">
    <p class="score"><b>76</b><span>점</span></p>
    <h1 class="title">말은 잘 통하는데 고집이 부딪히는 사이</h1>
    <div class="vs">
      <div class="vs-side"><span class="avatar is-text">서</span>최서아</div>
      <span class="vs-mid">×</span>
      <div class="vs-side"><span class="avatar is-text">소</span>한소윤</div>
    </div>
  </section>
  <section class="block is-list">
    <div class="block-head"><h2 class="h2">두 사람 풀이</h2></div>
    <div class="row"><span class="row-art"><img src="../assets/fluent/speech.svg" alt=""></span>
      <div class="row-main"><p class="row-sub">잘 맞는 점</p><p class="row-title">말이 잘 통해요</p></div></div>
    <div class="row"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <div class="row-main"><p class="row-title">잘 맞는 점 2가지 더</p><p class="row-sub">가입하면 보여요</p></div></div>
    <div class="row"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <div class="row-main"><p class="row-title">부딪히는 점 3가지</p><p class="row-sub">가입하면 보여요</p></div></div>
    <div class="row"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <div class="row-main"><p class="row-title">이렇게 해 보세요 2가지</p><p class="row-sub">가입하면 보여요</p></div></div>
    <div class="row"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
      <div class="row-main"><p class="row-title">두 사람 오행 비교</p><p class="row-sub">가입하면 보여요</p></div></div>
  </section>
  <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>이 링크는 보낸 날부터 30일, 11월 27일까지 열려요</span></p>
</main>
<div class="cta"><a class="btn primary full" href="start.html">가입하고 전부 확인하기</a></div>

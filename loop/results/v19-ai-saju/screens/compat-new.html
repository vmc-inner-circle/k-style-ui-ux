<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>궁합 · 상대 고르기</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="has-tab">
<main class="page">
  <header class="hero">
    <p class="eyebrow">궁합</p>
    <h1 class="title">누구와 볼까요</h1>
    <p class="lead">저장한 사람을 고르거나 새로 넣어요.</p>
  </header>

  <section class="block is-list" aria-label="상대 고르기">
    <div class="block-head"><h2 class="h2">저장한 사람</h2></div>
    <div role="radiogroup" aria-label="저장한 사람">
      <button class="row" role="radio" aria-checked="true"><span class="avatar is-text">도</span><div class="row-main"><p class="row-title">박도현 · 연인</p><p class="row-sub">1997년 8월 22일 양력 · 시간 모름</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg></span></button>
      <button class="row" role="radio" aria-checked="false"><span class="avatar is-text">엄</span><div class="row-main"><p class="row-title">김미경 · 엄마</p><p class="row-sub">1970년 5월 2일 양력 · 오전 10시</p></div><span class="row-trail"></span></button>
      <button class="row" role="radio" aria-checked="false"><span class="avatar is-text">서</span><div class="row-main"><p class="row-title">최서아 · 친구</p><p class="row-sub">1999년 11월 3일 양력 · 시간 모름</p></div><span class="row-trail"></span></button>
    </div>
    <a class="row is-add" href="person-edit.html"><span class="row-lead"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span><div class="row-main"><p class="row-title">새로 입력</p></div></a>
  </section>

  <section class="block">
    <div class="block-head"><h2 class="h2">관계</h2></div>
    <div class="chips" role="radiogroup" aria-label="관계">
      <button class="chip is-selected" role="radio" aria-checked="true">연인</button>
      <button class="chip" role="radio" aria-checked="false">배우자</button>
      <button class="chip" role="radio" aria-checked="false">가족</button>
      <button class="chip" role="radio" aria-checked="false">친구</button>
      <button class="chip" role="radio" aria-checked="false">동료</button>
    </div>
    <p class="block-note">관계에 따라 보는 관점이 달라져요.</p>
  </section>

  <section class="block">
    <div class="block-head"><h2 class="h2">박도현 정보</h2><a class="block-link" href="person-edit.html">고치기</a></div>
    <p class="info"><img src="../assets/fluent/calendar.svg" alt=""><span>1997년 8월 22일 양력</span></p>
    <span class="badge">시간 모름</span>
    <p class="block-note">태어난 시간을 몰라도 볼 수 있어요. 시간을 뺀 6글자로 풀어요.</p>
    <span class="badge is-info">무료</span>
    <p class="block-note">10월 30일에 본 사람이라 다시 봐도 별이 들지 않아요.</p>
    <p class="info"><img src="../assets/fluent/idcard.svg" alt=""><span>상대에게 알리지 않고, 내 계정에만 저장돼요.</span></p>
    <a class="btn primary" href="compat-result.html">궁합 보기</a>
  </section>
</main>
